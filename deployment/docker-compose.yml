version: '3.8'

services:
  # Backend API Server
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: fake-news-detector-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=backend/app.py
      - API_KEY=your-secret-api-key
      - MONGODB_URI=mongodb://mongo:27017/fake-news-detector
      - GOOGLE_FACTCHECK_API_KEY=${GOOGLE_FACTCHECK_API_KEY}
      - NEWSAPI_KEY=${NEWSAPI_KEY}
    volumes:
      - ../backend:/app/backend
      - ../data:/app/data
      - model_cache:/app/backend/models
    depends_on:
      - mongo
    networks:
      - fake-news-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB Database
  mongo:
    image: mongo:6.0
    container_name: fake-news-detector-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=fake-news-detector
    volumes:
      - mongo_data:/data/db
    networks:
      - fake-news-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend Development Server (optional, for development)
  frontend:
    image: node:16-alpine
    container_name: fake-news-detector-frontend
    working_dir: /app/frontend
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app/frontend
    command: >
      sh -c "npm install && npm start"
    environment:
      - REACT_APP_API_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - fake-news-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: fake-news-detector-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../deployment/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../deployment/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - fake-news-network

volumes:
  mongo_data:
  model_cache:

networks:
  fake-news-network:
    driver: bridge
